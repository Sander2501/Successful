# Example trading configuration.
# Copy to config/config.yaml and adjust. Epics are Capital.com market
# identifiers (look them up via the `search_markets` REST call).

starting_equity: 10000.0

instruments:
  # spread_points is the instrument's REAL absolute spread (run `forex-bot
  # spreads` to measure it). It is per-instrument because a pip is 0.0001 on
  # EUR/USD but 0.01 on USD/JPY — a single global spread mis-prices a mixed
  # basket. Omit it to fall back to costs.spread_points.
  - epic: EURUSD
    timeframe: MINUTE_15
    value_per_point: 1.0
    spread_points: 0.0001
  - epic: GBPUSD
    timeframe: MINUTE_15
    value_per_point: 1.0
    spread_points: 0.0001
  # For spread/pairs trading, economically-linked CROSSES are better candidates
  # than two USD legs (EURUSD/GBPUSD share the USD move that cancels out). Use
  # `forex-bot search EURGBP` etc. to confirm the exact Capital.com epics, then
  # add the ones that screen as cointegrated. Common candidates:
  #   - {epic: EURGBP, timeframe: MINUTE_15}
  #   - {epic: EURCHF, timeframe: MINUTE_15}
  #   - {epic: AUDNZD, timeframe: MINUTE_15}
  #   - {epic: GBPCHF, timeframe: MINUTE_15}

# Strategy selection: one of the keys in forex_bot.strategy.STRATEGY_REGISTRY
# ("ema_crossover", "rsi_reversion").
# Strategy selection: "ema_crossover", "rsi_reversion", or "donchian_breakout".
# Durable state for live trading: positions + the equity high-water mark and
# kill-switch flag survive restarts (so a crash doesn't reset the drawdown
# backstop). null keeps state in memory only. Path is git-ignored.
state_db: data/db/state.sqlite

strategy: ema_crossover
strategy_params:
  fast: 12
  slow: 26
  atr_period: 14
  atr_stop_mult: 2.0
  atr_target_mult: 3.0
  # Whipsaw filters (see strategy docstring). Set trend_filter to null to disable.
  trend_filter: 200        # only trade in the direction of the 200-EMA regime
  # min_separation_pct discards crosses where the EMAs are barely apart. It is a
  # FRACTION OF PRICE, so it is sensitive to the instrument's volatility — too
  # large a value silences all trades. Tune per market; 0.0 disables it.
  min_separation_pct: 0.0
  # ADX regime gate: only enter when trend strength exceeds the threshold.
  # Set adx_period to null to disable. This is the main "edge" lever for trend
  # systems — it keeps them out of range-bound chop.
  adx_period: 14
  adx_threshold: 22.0

# Walk-forward optimization (`forex-bot optimize`). Parameters are tuned on each
# in-sample window and scored ONLY on the following out-of-sample window, so the
# reported edge is the part that survives on unseen data.
optimize:
  # Windows sized to fit ~1000 downloaded bars. Increase once you have more
  # history (download --max-bars now pages past the 1000/request cap).
  is_bars: 600             # in-sample window length (bars)
  oos_bars: 200            # out-of-sample window length (bars)
  step_bars: 200           # how far each fold rolls forward
  metric: sharpe           # sharpe | sortino | total_return | profit_factor | expectancy
  warmup_bars: 250         # prior bars used to warm indicators in each OOS window
  min_trades: 5            # ignore in-sample params that trade fewer than this
  param_grid:
    fast: [8, 12, 16]
    slow: [26, 40, 60]
    trend_filter: [100, 200]
    adx_threshold: [18.0, 22.0, 26.0]

# Strategy rejection report (`forex-bot report`). Runs every strategy through the
# same walk-forward config above and writes results/strategy_report.{csv,md} with
# a deterministic PASS/FAIL per strategy. These thresholds define rejection; the
# defaults are strict (omit the block to use them). A strategy fails if ANY rule
# trips.
report:
  min_oos_return_pct: 0.0        # OOS return must be > this
  min_profit_factor: 1.1
  min_pct_positive_folds: 50.0   # share of OOS folds that must be profitable
  min_trades: 40                 # reject thin samples
  min_avg_r: 0.0                 # avg R must be > this (skipped if no stops)
  max_instrument_dominance: 0.70 # reject if one instrument is >70% of positive return
  worst_fold_floor_pct: -10.0    # worst single OOS fold may not breach this
  worst_month_floor_pct: -10.0   # worst OOS month may not breach this

# Simulated trading costs (used only by the backtester).
costs:
  spread_points: 0.0001      # ~1 pip on a 5-decimal FX pair
  commission_per_trade: 0.0
  slippage_points: 0.00002

# Risk framework — enforced identically in backtest and live.
risk:
  risk_per_trade: 0.01       # risk 1% of equity per trade (via stop distance)
  max_position_pct: 0.20     # cap notional at 20% of equity per position
  max_open_positions: 5
  max_daily_loss_pct: 0.05   # halt new entries after a 5% daily drawdown
  max_leverage: 30.0
  # Correlation control: EURUSD, GBPUSD, AUDUSD are all *short USD* when long, so
  # they stack the same bet. These cap that hidden concentration.
  # NOTE: the *_exposure_pct caps are net notional / equity, so they must be
  # >= max_position_pct or they block the very first trade. 1.0 ~= off.
  max_currency_exposure_pct: 0.60   # net USD/EUR/... exposure <= 60% of equity
  max_positions_per_currency: null  # or an integer to cap count sharing a currency

  # Data-driven correlation grouping: cluster instruments whose return
  # correlation exceeds the threshold and cap net directional exposure per
  # cluster (catches correlated pairs that don't share a currency code).
  correlation_threshold: 0.7        # null disables grouping
  max_correlated_exposure_pct: 0.80
  max_positions_per_group: null
  correlation_refresh_bars: 500     # re-estimate every N candles live; null = once

  # Portfolio kill switch: flatten and halt once equity falls this far below its
  # high-water mark. This is the hard backstop beyond the daily-loss halt.
  max_total_drawdown_pct: 0.15      # 1.0 disables
  # Kill-switch peak window. null = all-time high-water mark (permanent halt
  # until a manual reset). Set to N to measure drawdown from the highest equity
  # in the last N equity observations: an old peak expires and the switch becomes
  # recoverable, re-arming (and resuming trading) once equity recovers.
  drawdown_peak_window_bars: null

  # Position sizing model.
  #   fixed_fractional : risk_per_trade of equity per trade via the stop distance.
  #   vol_target       : size so a 1-ATR move equals vol_target_pct of equity, so
  #                      every instrument contributes equal risk regardless of its
  #                      own volatility.
  sizing_mode: fixed_fractional
  vol_target_pct: 0.01

# Per-instrument currency decomposition is auto-parsed from 6-letter epics
# (EURUSD -> EUR/USD). For non-standard epics, set base_currency/quote_currency
# on the instrument entry above.
